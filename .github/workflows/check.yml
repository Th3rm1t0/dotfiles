name: Flake Check
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # NixOS toplevel のクロージャ（実測 4.7GiB）+ ツール類が入るサイズを確保しないとキャッシュが効かない
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D

      # 各検証は独立しており、Nix デーモンがストアへの同時アクセスを調停するため並列実行できる
      - parallel:
          - name: Flake check (checks / packages / devShells の評価と lint)
            run: nix flake check

          # ホスト追加時に CI の変更が不要になるよう、定義を動的に列挙してビルドする
          - name: Build home configurations
            run: |
              nix eval --json '.#homeConfigurations' \
                --apply 'c: map (n: ".#homeConfigurations.\"${n}\".activationPackage") (builtins.attrNames c)' \
                | jq -r '.[]' \
                | xargs -r -t nix build --no-link --print-build-logs

          - name: Build NixOS configurations
            run: |
              nix eval --json '.#nixosConfigurations' \
                --apply 'c: map (n: ".#nixosConfigurations.\"${n}\".config.system.build.toplevel") (builtins.attrNames c)' \
                | jq -r '.[]' \
                | xargs -r -t nix build --no-link --print-build-logs
